<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153f36">
  <meta name="description" content="가로와 세로에 1부터 6까지 한 번씩. VoiceOver로 즐기는 빈자리 카드.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="빈자리 카드">
  <title>빈자리 카드</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="game" aria-label="빈자리 카드">
    <header class="header">
      <div><h1>빈자리 카드</h1><p id="progress">문제를 준비하고 있습니다.</p></div>
      <div class="header-actions"><button id="new-open" type="button">새 판</button></div>
    </header>
    <section id="board" class="board" aria-label="카드판. 가로와 세로에 1부터 6까지 한 번씩"></section>
    <section class="inspector" aria-label="현재 자리">
      <div class="navigation"><button id="number-open" type="button" class="primary">숫자 입력</button><button id="erase" type="button">지우기</button></div>
      <div class="readout"><p id="selection">빈자리 선택</p><p id="message">빈자리를 선택하고 가로와 세로를 확인하세요.</p></div>
    </section>
    <section class="tools" aria-label="확인과 편집">
      <button id="read-row" type="button">가로 듣기</button><button id="read-column" type="button">세로 듣기</button><button id="summary" type="button">전체 상황</button>
    </section>
  </main>
  <p id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <dialog id="number-dialog" aria-labelledby="number-title">
    <h2 id="number-title">숫자 선택</h2>
    <div class="picker-context"><button id="picker-row" type="button">가로 듣기</button><button id="picker-column" type="button">세로 듣기</button></div>
    <p id="picker-message" role="status" aria-live="polite" aria-atomic="true">놓을 숫자를 선택하세요.</p>
    <div id="numbers" class="numbers" role="group" aria-label="놓을 숫자"></div>
    <button id="number-cancel" type="button">취소하고 돌아가기</button>
  </dialog>
  <dialog id="new-dialog" aria-labelledby="new-title">
    <h2 id="new-title">새 판을 시작할까요?</h2><p>현재 진행을 지우고 새로운 문제를 시작합니다.</p>
    <div class="dialog-actions"><button id="new-cancel" type="button" autofocus>계속하기</button><button id="new-confirm" type="button" class="primary">새 판 시작</button></div>
  </dialog>
  <noscript>이 게임을 이용하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
</body>
</html>
